name: simple_sheet_music
description: Sheet music for Flutter. A scrolling, editable view of a score, with an immutable score model, a layout engine and MIDI playback.
version: 1.0.0
publish_to: none
homepage: https://github.com/Tseku210/music_sheet

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - packages/score_layout
  - packages/score_model

dependencies:
  flutter:
    sdk: flutter
  flutter_midi_pro: ^4.0.4
  score_layout:
    path: packages/score_layout
  score_model:
    path: packages/score_model

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  pedantic_mono: ^1.38.1
  plugin_platform_interface: ^2.1.8

flutter:
  assets:
    - fonts/OFL.txt
  fonts:
    - family: Bravura
      fonts:
        - asset: fonts/Bravura.otf
