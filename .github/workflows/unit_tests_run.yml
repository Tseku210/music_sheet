name: Unit tests run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Library unit tests
        run: flutter test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: test-failures
          path: test/failures/**
          if-no-files-found: ignore
