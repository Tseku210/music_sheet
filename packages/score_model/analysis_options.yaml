include: package:pedantic_mono/analysis_options.yaml

linter:
  rules:
    lines_longer_than_80_chars: false
    flutter_style_todos: false
    # The root package targets Dart 3.6, which has no primary constructors.
    # The sketch keeps classic constructors so the field docs stay on fields.
    use_primary_constructors: false
    use_declaring_parameters: false
    unnecessary_type_name_in_constructor: false
    # Factory bodies are unimplemented in the sketch, so their parameters
    # read as unused until the bodies land.
    avoid_unused_constructor_parameters: false
