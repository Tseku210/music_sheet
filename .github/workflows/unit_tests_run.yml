name: Unit tests run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Each suite runs even when one before it failed, so that one run
      # shows every failure.
      - name: Library unit tests
        if: ${{ !cancelled() }}
        run: flutter test

      - name: Score model tests
        if: ${{ !cancelled() }}
        run: dart test
        working-directory: packages/score_model

      - name: Layout engine tests
        if: ${{ !cancelled() }}
        run: dart test
        working-directory: packages/score_layout

      - name: Example tests
        if: ${{ !cancelled() }}
        run: flutter test
        working-directory: example
